<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="dg-pages-flow-title dg-pages-flow-desc">
  <title id="dg-pages-flow-title">Landing-page pipeline</title>
  <desc id="dg-pages-flow-desc">The operator approves a proposed scope and its sources; Eumon collects records with the robots-aware dataset-scrape Workflow, merges duplicates and generates pages behind a quality gate; pages are served on the client's domain through a proxy to /p, measured through sessions, leads and Search Console, and optimized with a CTA bandit and title suggestions that feed back into what is served.</desc>
  <defs>
    <marker id="dg-pages-flow-arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="392" class="d-paper"/>

  <!-- Lanes -->
  <line x1="0" y1="40" x2="960" y2="40" class="d-zone"/>
  <line x1="0" y1="136" x2="960" y2="136" class="d-zone"/>
  <line x1="0" y1="232" x2="960" y2="232" class="d-zone"/>
  <line x1="0" y1="328" x2="960" y2="328" class="d-zone"/>
  <line x1="88" y1="40" x2="88" y2="328" class="d-zone"/>
  <text x="44" y="92" font-size="9" letter-spacing="0.08em" text-anchor="middle" class="d-mono d-muted">OPERATOR</text>
  <text x="44" y="188" font-size="9" letter-spacing="0.08em" text-anchor="middle" class="d-mono d-muted">EUMON</text>
  <text x="44" y="276" font-size="9" letter-spacing="0.08em" text-anchor="middle" class="d-mono d-muted">CLIENT</text>
  <text x="44" y="288" font-size="9" letter-spacing="0.08em" text-anchor="middle" class="d-mono d-muted">DOMAIN</text>

  <!-- Step header -->
  <rect x="136" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="144" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">1</text>
  <rect x="244" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="252" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">2</text>
  <rect x="352" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="360" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">3</text>
  <rect x="460" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="468" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">4</text>
  <rect x="568" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="576" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">5</text>
  <rect x="676" y="12" width="16" height="16" rx="2" class="d-node-focal"/>
  <text x="684" y="24" font-size="9" text-anchor="middle" class="d-mono d-accent">6</text>
  <rect x="784" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="792" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">7</text>
  <rect x="892" y="12" width="16" height="16" rx="2" class="d-node"/>
  <text x="900" y="24" font-size="9" text-anchor="middle" class="d-mono d-muted">8</text>

  <!-- Connectors -->
  <line x1="192" y1="88" x2="204" y2="88" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <path d="M300,88 H352 Q360,88 360,96 V148" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <line x1="408" y1="184" x2="420" y2="184" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <line x1="516" y1="184" x2="528" y2="184" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <path d="M624,184 H676 Q684,184 684,192 V244" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <path d="M732,268 H784 Q792,268 792,260 V220" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <line x1="840" y1="184" x2="852" y2="184" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <path d="M900,220 V284 Q900,292 892,292 H732" class="d-arrow-dashed" marker-end="url(#dg-pages-flow-arrow)"/>

  <rect x="764" y="300" width="104" height="12" rx="0" class="d-mask"/>
  <text x="816" y="309" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">CTA ARMS, TITLES</text>

  <!-- Steps -->
  <rect x="96" y="52" width="96" height="72" rx="0" class="d-node"/>
  <text x="144" y="78" font-size="13" text-anchor="middle" class="d-name d-ink">Scope</text>
  <text x="144" y="96" font-size="9" text-anchor="middle" class="d-mono d-muted">goal → proposed</text>
  <text x="144" y="109" font-size="9" text-anchor="middle" class="d-mono d-muted">datasets</text>

  <rect x="204" y="52" width="96" height="72" rx="0" class="d-node"/>
  <text x="252" y="78" font-size="13" text-anchor="middle" class="d-name d-ink">Sources</text>
  <text x="252" y="96" font-size="9" text-anchor="middle" class="d-mono d-muted">approve URLs,</text>
  <text x="252" y="109" font-size="9" text-anchor="middle" class="d-mono d-muted">tables, Supabase</text>

  <rect x="312" y="148" width="96" height="72" rx="0" class="d-node"/>
  <text x="360" y="174" font-size="13" text-anchor="middle" class="d-name d-ink">Collect</text>
  <text x="360" y="192" font-size="9" text-anchor="middle" class="d-mono d-muted">dataset-scrape</text>
  <text x="360" y="205" font-size="9" text-anchor="middle" class="d-mono d-muted">obeys robots.txt</text>

  <rect x="420" y="148" width="96" height="72" rx="0" class="d-node"/>
  <text x="468" y="174" font-size="13" text-anchor="middle" class="d-name d-ink">Dedupe</text>
  <text x="468" y="192" font-size="9" text-anchor="middle" class="d-mono d-muted">merge records</text>
  <text x="468" y="205" font-size="9" text-anchor="middle" class="d-mono d-muted">naming one thing</text>

  <rect x="528" y="148" width="96" height="72" rx="0" class="d-node"/>
  <text x="576" y="174" font-size="13" text-anchor="middle" class="d-name d-ink">Generate</text>
  <text x="576" y="192" font-size="9" text-anchor="middle" class="d-mono d-muted">quality gate:</text>
  <text x="576" y="205" font-size="9" text-anchor="middle" class="d-mono d-muted">thin stays draft</text>

  <rect x="636" y="244" width="96" height="72" rx="0" class="d-paper"/>
  <rect x="636" y="244" width="96" height="72" rx="0" class="d-node-focal"/>
  <text x="684" y="270" font-size="13" text-anchor="middle" class="d-name d-accent">Serve</text>
  <text x="684" y="288" font-size="9" text-anchor="middle" class="d-mono d-muted">proxy path →</text>
  <text x="684" y="301" font-size="9" text-anchor="middle" class="d-mono d-muted">/p/{siteId}/…</text>

  <rect x="744" y="148" width="96" height="72" rx="0" class="d-node"/>
  <text x="792" y="174" font-size="13" text-anchor="middle" class="d-name d-ink">Measure</text>
  <text x="792" y="192" font-size="9" text-anchor="middle" class="d-mono d-muted">sessions, leads,</text>
  <text x="792" y="205" font-size="9" text-anchor="middle" class="d-mono d-muted">Search Console</text>

  <rect x="852" y="148" width="96" height="72" rx="0" class="d-node"/>
  <text x="900" y="174" font-size="13" text-anchor="middle" class="d-name d-ink">Optimize</text>
  <text x="900" y="192" font-size="9" text-anchor="middle" class="d-mono d-muted">CTA bandit,</text>
  <text x="900" y="205" font-size="9" text-anchor="middle" class="d-mono d-muted">title ideas</text>

  <!-- Legend -->
  <text x="24" y="363" font-size="9" letter-spacing="0.14em" class="d-mono d-soft">LEGEND</text>
  <rect x="96" y="354" width="16" height="10" rx="0" class="d-node-focal"/>
  <text x="120" y="363" font-size="9" class="d-mono d-muted">focal step</text>
  <rect x="212" y="354" width="16" height="10" rx="0" class="d-node"/>
  <text x="236" y="363" font-size="9" class="d-mono d-muted">step</text>
  <line x1="288" y1="359" x2="316" y2="359" class="d-arrow" marker-end="url(#dg-pages-flow-arrow)"/>
  <text x="324" y="363" font-size="9" class="d-mono d-muted">hand-off</text>
  <line x1="400" y1="359" x2="428" y2="359" class="d-arrow-dashed" marker-end="url(#dg-pages-flow-arrow)"/>
  <text x="436" y="363" font-size="9" class="d-mono d-muted">feedback into what is served</text>
  <text x="636" y="363" font-size="9" class="d-mono d-muted">lane = who acts or where it runs</text>
</svg>
