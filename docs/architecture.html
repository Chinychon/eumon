<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eumon Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Eumon growth engine</p>
    <h1>One Worker, one database, the open web around it</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Eumon growth engine architecture</title>
        <desc id="architecture-desc">Operators use the web app and searchers land on generated pages, both served by one Cloudflare Worker whose workflows crawl the public web, call a language model and Google and GitHub, and store everything in D1.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Cloudflare Worker -->
        <rect x="216" y="128" width="440" height="296" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="380" y="132" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="141" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE WORKER</text>

        <!-- Arrows (behind nodes) -->
        <!-- Operator → Web app -->
        <line x1="168" y1="192" x2="240" y2="192" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Searcher → Landing pages -->
        <line x1="168" y1="368" x2="240" y2="368" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Web app → Workflows -->
        <line x1="400" y1="192" x2="472" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Web app → D1 -->
        <path d="M 400,208 H 428 Q 436,208 436,216 V 344 Q 436,352 444,352 H 472"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Workflows → D1 -->
        <line x1="552" y1="224" x2="552" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- D1 → Landing pages (primary flow: published pages) -->
        <line x1="472" y1="376" x2="400" y2="376" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Workflows → Public web -->
        <line x1="632" y1="176" x2="736" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Workflows → Language model -->
        <path d="M 632,192 H 700 Q 708,192 708,200 V 264 Q 708,272 716,272 H 736"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Workflows → Google · GitHub -->
        <path d="M 632,208 H 676 Q 684,208 684,216 V 376 Q 684,384 692,384 H 736"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels -->
        <rect x="180" y="170" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="179" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="180" y="346" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="355" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="408" y="170" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="179" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>

        <rect x="444" y="274" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

        <rect x="560" y="274" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>

        <rect x="412" y="384" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="393" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGES</text>

        <rect x="664" y="154" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="686" y="163" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRAWL</text>

        <!-- Node: Operator (input) -->
        <rect x="40" y="160" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="160" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="64" y="177" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="104" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
        <text x="104" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboard</text>

        <!-- Node: Searcher (input) -->
        <rect x="40" y="336" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="336" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="344" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="64" y="353" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="104" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Searcher</text>
        <text x="104" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from Google</text>

        <!-- Node: Web app (backend) -->
        <rect x="240" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="168" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="262" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="320" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web app</text>
        <text x="320" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/web · /api</text>

        <!-- Node: Landing pages (focal) -->
        <rect x="240" y="336" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="336" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="248" y="344" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="262" y="353" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MVP</text>
        <text x="320" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Landing pages</text>
        <text x="320" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/p/[siteId] · pages</text>

        <!-- Node: Workflows (backend) -->
        <rect x="472" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="160" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="480" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="492" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WF</text>
        <text x="552" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workflows</text>
        <text x="552" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">analysis · scrape · sync</text>

        <!-- Node: D1 (store) -->
        <rect x="472" y="336" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="336" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="480" y="344" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="492" y="353" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="552" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">D1</text>
        <text x="552" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sites · records · pages</text>

        <!-- Node: Public web (external) -->
        <rect x="736" y="144" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="144" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="744" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="758" y="161" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="828" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public web</text>
        <text x="828" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">site + competitors</text>

        <!-- Node: Language model (external) -->
        <rect x="736" y="240" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="240" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="744" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="758" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="828" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Language model</text>
        <text x="828" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepSeek · Claude · WAI</text>

        <!-- Node: Google · GitHub (external) -->
        <rect x="736" y="352" width="184" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="352" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="744" y="360" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="758" y="369" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="828" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google · GitHub</text>
        <text x="828" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Search Console · App</text>

        <!-- Legend strip -->
        <line x1="40" y1="444" x2="920" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="476" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">MVP core</text>

        <rect x="140" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="160" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Worker code</text>

        <rect x="252" y="476" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="272" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="332" y="476" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="352" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">People</text>

        <rect x="420" y="476" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="440" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <line x1="520" y1="482" x2="548" y2="482" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="556" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

        <line x1="652" y1="482" x2="680" y2="482" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      </svg>
    </div>
  </div>
</body>
</html>
