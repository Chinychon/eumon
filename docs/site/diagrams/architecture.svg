<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="dg-architecture-title dg-architecture-desc">
  <title id="dg-architecture-title">Eumon system architecture</title>
  <desc id="dg-architecture-desc">One Cloudflare Worker serves the dashboard, API routes, /p landing pages and /r share links, runs the daily cron and three Workflows, and uses D1 and Browser Rendering; the client's website proxies a path to /p, and the Worker calls Google APIs, third-party connectors and language models.</desc>
  <defs>
    <marker id="dg-architecture-arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead"/></marker>
    <marker id="dg-architecture-arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead-accent"/></marker>
    <marker id="dg-architecture-arrow-link" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead-link"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="576" class="d-paper"/>

  <!-- Zone: the Cloudflare account -->
  <rect x="232" y="40" width="480" height="472" rx="0" class="d-zone"/>
  <rect x="244" y="34" width="136" height="12" rx="0" class="d-mask"/>
  <text x="250" y="43" font-size="9" letter-spacing="0.14em" class="d-mono d-soft">CLOUDFLARE ACCOUNT</text>

  <!-- Connectors (before nodes) -->
  <line x1="184" y1="104" x2="264" y2="104" class="d-arrow" marker-end="url(#dg-architecture-arrow)"/>
  <line x1="184" y1="188" x2="264" y2="188" class="d-arrow-accent" marker-end="url(#dg-architecture-arrow-accent)"/>
  <line x1="264" y1="212" x2="184" y2="212" class="d-arrow-link" marker-end="url(#dg-architecture-arrow-link)"/>
  <line x1="104" y1="296" x2="104" y2="232" class="d-arrow" marker-end="url(#dg-architecture-arrow)"/>
  <line x1="368" y1="364" x2="368" y2="424" class="d-arrow" marker-end="url(#dg-architecture-arrow)"/>
  <line x1="576" y1="364" x2="576" y2="424" class="d-arrow" marker-end="url(#dg-architecture-arrow)"/>
  <line x1="680" y1="108" x2="776" y2="108" class="d-arrow-link" marker-end="url(#dg-architecture-arrow-link)"/>
  <line x1="680" y1="220" x2="776" y2="220" class="d-arrow-link" marker-end="url(#dg-architecture-arrow-link)"/>
  <line x1="680" y1="328" x2="776" y2="328" class="d-arrow-link" marker-end="url(#dg-architecture-arrow-link)"/>

  <!-- Arrow labels -->
  <rect x="204" y="84" width="40" height="12" rx="0" class="d-mask"/>
  <text x="224" y="93" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">HTTPS</text>
  <rect x="204" y="168" width="40" height="12" rx="0" class="d-mask"/>
  <text x="224" y="177" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-accent">PROXY</text>
  <rect x="204" y="220" width="40" height="12" rx="0" class="d-mask"/>
  <text x="224" y="229" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">CRAWL</text>
  <rect x="112" y="258" width="48" height="12" rx="0" class="d-mask"/>
  <text x="136" y="267" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">VISITS</text>
  <rect x="376" y="388" width="76" height="12" rx="0" class="d-mask"/>
  <text x="414" y="397" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">READ, WRITE</text>
  <rect x="584" y="388" width="48" height="12" rx="0" class="d-mask"/>
  <text x="608" y="397" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">RENDER</text>
  <rect x="690" y="88" width="76" height="12" rx="0" class="d-mask"/>
  <text x="728" y="97" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">OAUTH, SYNC</text>
  <rect x="694" y="200" width="68" height="12" rx="0" class="d-mask"/>
  <text x="728" y="209" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">REPO, DATA</text>
  <rect x="702" y="308" width="52" height="12" rx="0" class="d-mask"/>
  <text x="728" y="317" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">PROMPTS</text>

  <!-- Outside: who reaches the Worker -->
  <rect x="24" y="72" width="160" height="64" rx="0" class="d-ext"/>
  <text x="104" y="100" font-size="13" text-anchor="middle" class="d-name d-ink">User</text>
  <text x="104" y="118" font-size="10" text-anchor="middle" class="d-mono d-muted">browser, signed in</text>

  <rect x="24" y="168" width="160" height="64" rx="0" class="d-ext"/>
  <text x="104" y="196" font-size="13" text-anchor="middle" class="d-name d-ink">Client website</text>
  <text x="104" y="214" font-size="10" text-anchor="middle" class="d-mono d-muted">a path → /p/{siteId}</text>

  <rect x="24" y="296" width="160" height="64" rx="0" class="d-ext"/>
  <text x="104" y="324" font-size="13" text-anchor="middle" class="d-name d-ink">Googlebot</text>
  <text x="104" y="342" font-size="10" text-anchor="middle" class="d-mono d-muted">and searchers</text>

  <!-- The Worker (focal) -->
  <rect x="264" y="72" width="416" height="292" rx="0" class="d-paper"/>
  <rect x="264" y="72" width="416" height="292" rx="0" class="d-node-focal"/>
  <text x="280" y="99" font-size="14" class="d-name d-accent">Worker “eumon”</text>
  <text x="664" y="99" font-size="10" text-anchor="end" class="d-mono d-muted">apps/web/worker.ts</text>

  <rect x="280" y="116" width="384" height="80" rx="0" class="d-node"/>
  <text x="296" y="139" font-size="13" class="d-name d-ink">vinext app</text>
  <text x="296" y="159" font-size="10" class="d-mono d-muted">dashboard · API routes (/api/*)</text>
  <text x="296" y="177" font-size="10" class="d-mono d-muted">/p landing pages · /r share links</text>

  <rect x="280" y="208" width="384" height="64" rx="0" class="d-node"/>
  <text x="296" y="231" font-size="13" class="d-name d-ink">scheduled()</text>
  <text x="296" y="251" font-size="10" class="d-mono d-muted">cron 15 4 * * * → one search-sync per site</text>

  <rect x="280" y="284" width="384" height="64" rx="0" class="d-node"/>
  <text x="296" y="307" font-size="13" class="d-name d-ink">Workflows</text>
  <text x="296" y="327" font-size="10" class="d-mono d-muted">site-analysis · dataset-scrape · search-sync</text>

  <!-- Bindings -->
  <rect x="280" y="424" width="176" height="64" rx="0" class="d-store"/>
  <text x="368" y="452" font-size="13" text-anchor="middle" class="d-name d-ink">D1</text>
  <text x="368" y="470" font-size="10" text-anchor="middle" class="d-mono d-muted">binding DB · SQLite</text>

  <rect x="488" y="424" width="176" height="64" rx="0" class="d-store"/>
  <text x="576" y="452" font-size="13" text-anchor="middle" class="d-name d-ink">Browser Rendering</text>
  <text x="576" y="470" font-size="10" text-anchor="middle" class="d-mono d-muted">binding BROWSER</text>

  <!-- Outside: what the Worker calls -->
  <rect x="776" y="72" width="160" height="72" rx="0" class="d-ext"/>
  <text x="856" y="98" font-size="13" text-anchor="middle" class="d-name d-ink">Google APIs</text>
  <text x="856" y="116" font-size="10" text-anchor="middle" class="d-mono d-muted">Search Console, GA4</text>
  <text x="856" y="131" font-size="10" text-anchor="middle" class="d-mono d-muted">URL Inspection, CrUX</text>

  <rect x="776" y="184" width="160" height="72" rx="0" class="d-ext"/>
  <text x="856" y="210" font-size="13" text-anchor="middle" class="d-name d-ink">Third-party APIs</text>
  <text x="856" y="228" font-size="10" text-anchor="middle" class="d-mono d-muted">GitHub App, DataForSEO</text>
  <text x="856" y="243" font-size="10" text-anchor="middle" class="d-mono d-muted">Bing, IndexNow, OPR</text>

  <rect x="776" y="292" width="160" height="72" rx="0" class="d-ext"/>
  <text x="856" y="318" font-size="13" text-anchor="middle" class="d-name d-ink">Language models</text>
  <text x="856" y="336" font-size="10" text-anchor="middle" class="d-mono d-muted">DeepSeek, then Claude,</text>
  <text x="856" y="351" font-size="10" text-anchor="middle" class="d-mono d-muted">then Workers AI (AI)</text>

  <!-- Legend -->
  <line x1="24" y1="528" x2="936" y2="528" class="d-zone"/>
  <text x="24" y="553" font-size="9" letter-spacing="0.14em" class="d-mono d-soft">LEGEND</text>
  <rect x="96" y="544" width="16" height="10" rx="0" class="d-node-focal"/>
  <text x="120" y="553" font-size="9" class="d-mono d-muted">the Worker</text>
  <rect x="212" y="544" width="16" height="10" rx="0" class="d-store"/>
  <text x="236" y="553" font-size="9" class="d-mono d-muted">Cloudflare binding</text>
  <rect x="368" y="544" width="16" height="10" rx="0" class="d-ext"/>
  <text x="392" y="553" font-size="9" class="d-mono d-muted">outside Cloudflare</text>
  <line x1="524" y1="549" x2="552" y2="549" class="d-arrow" marker-end="url(#dg-architecture-arrow)"/>
  <text x="560" y="553" font-size="9" class="d-mono d-muted">request / binding call</text>
  <line x1="708" y1="549" x2="736" y2="549" class="d-arrow-link" marker-end="url(#dg-architecture-arrow-link)"/>
  <text x="744" y="553" font-size="9" class="d-mono d-muted">outbound HTTP</text>
  <line x1="836" y1="549" x2="864" y2="549" class="d-arrow-accent" marker-end="url(#dg-architecture-arrow-accent)"/>
  <text x="872" y="553" font-size="9" class="d-mono d-muted">proxy</text>
</svg>
