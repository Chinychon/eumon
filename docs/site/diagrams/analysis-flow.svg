<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="dg-analysis-flow-title dg-analysis-flow-desc">
  <title id="dg-analysis-flow-title">Site analysis run</title>
  <desc id="dg-analysis-flow-desc">POST to a site's analyses route starts a site-analysis Workflow that loads the site, queues every sitemap URL, crawls them as Googlebot in batches of 100 saved with their counters, researches competitors, reads the inventory, analyzes with GitHub, the language model and Search Console, and saves the report, while the dashboard polls the progress route, which reads crawl_counts.</desc>
  <defs>
    <marker id="dg-analysis-flow-arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead"/></marker>
    <marker id="dg-analysis-flow-arrow-accent" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead-accent"/></marker>
    <marker id="dg-analysis-flow-arrow-link" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" class="d-arrowhead-link"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" class="d-paper"/>

  <!-- Fragments (painted first) -->
  <rect x="440" y="216" width="448" height="148" rx="0" class="d-arrow-accent"/>
  <rect x="64" y="548" width="424" height="100" rx="0" class="d-zone"/>

  <!-- Lifelines -->
  <line x1="88" y1="72" x2="88" y2="664" class="d-zone"/>
  <line x1="272" y1="72" x2="272" y2="664" class="d-zone"/>
  <line x1="464" y1="72" x2="464" y2="664" class="d-zone"/>
  <line x1="664" y1="72" x2="664" y2="664" class="d-zone"/>
  <line x1="864" y1="72" x2="864" y2="664" class="d-zone"/>

  <!-- Activation bars -->
  <rect x="268" y="104" width="8" height="56" rx="0" class="d-store"/>
  <rect x="660" y="144" width="8" height="372" rx="0" class="d-store"/>
  <rect x="268" y="592" width="8" height="48" rx="0" class="d-store"/>

  <!-- Fragment tabs and guards -->
  <rect x="440" y="216" width="48" height="16" rx="0" class="d-node-focal"/>
  <text x="464" y="228" font-size="9" letter-spacing="0.12em" text-anchor="middle" class="d-mono d-accent">LOOP</text>
  <text x="476" y="248" font-size="9" class="d-mono d-muted">[crawl-batch-n, 100 URLs]</text>
  <rect x="64" y="548" width="48" height="16" rx="0" class="d-node"/>
  <text x="88" y="560" font-size="9" letter-spacing="0.12em" text-anchor="middle" class="d-mono d-muted">LOOP</text>
  <text x="124" y="560" font-size="9" class="d-mono d-muted">[every few seconds, alongside the steps]</text>

  <!-- Messages -->
  <line x1="88" y1="112" x2="268" y2="112" class="d-arrow-link" marker-end="url(#dg-analysis-flow-arrow-link)"/>
  <line x1="276" y1="152" x2="660" y2="152" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="660" y1="192" x2="464" y2="192" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="660" y1="280" x2="464" y2="280" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="668" y1="312" x2="864" y2="312" class="d-arrow-accent" marker-end="url(#dg-analysis-flow-arrow-accent)"/>
  <line x1="660" y1="344" x2="464" y2="344" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="668" y1="400" x2="864" y2="400" class="d-arrow-link" marker-end="url(#dg-analysis-flow-arrow-link)"/>
  <line x1="660" y1="436" x2="464" y2="436" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="668" y1="472" x2="864" y2="472" class="d-arrow-link" marker-end="url(#dg-analysis-flow-arrow-link)"/>
  <line x1="660" y1="508" x2="464" y2="508" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <line x1="88" y1="600" x2="268" y2="600" class="d-arrow-link" marker-end="url(#dg-analysis-flow-arrow-link)"/>
  <line x1="276" y1="632" x2="464" y2="632" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>

  <!-- Message labels -->
  <rect x="128" y="92" width="104" height="12" rx="0" class="d-mask"/>
  <text x="180" y="101" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">POST …/ANALYSES</text>
  <rect x="318" y="132" width="100" height="12" rx="0" class="d-mask"/>
  <text x="368" y="141" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">CREATE INSTANCE</text>
  <rect x="504" y="172" width="120" height="12" rx="0" class="d-mask"/>
  <text x="564" y="181" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">LOAD-SITE, ENQUEUE</text>
  <rect x="520" y="260" width="88" height="12" rx="0" class="d-mask"/>
  <text x="564" y="269" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">LIST PENDING</text>
  <rect x="710" y="292" width="108" height="12" rx="0" class="d-mask"/>
  <text x="764" y="301" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-accent">GET AS GOOGLEBOT</text>
  <rect x="500" y="324" width="128" height="12" rx="0" class="d-mask"/>
  <text x="564" y="333" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">SAVE BATCH + COUNTS</text>
  <rect x="706" y="380" width="116" height="12" rx="0" class="d-mask"/>
  <text x="764" y="389" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">RESEARCH-{DOMAIN}</text>
  <rect x="528" y="416" width="72" height="12" rx="0" class="d-mask"/>
  <text x="564" y="425" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">INVENTORY</text>
  <rect x="688" y="452" width="152" height="12" rx="0" class="d-mask"/>
  <text x="764" y="461" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">ANALYZE: REPO, LLM, GSC</text>
  <rect x="524" y="488" width="80" height="12" rx="0" class="d-mask"/>
  <text x="564" y="497" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">SAVE REPORT</text>
  <rect x="130" y="580" width="100" height="12" rx="0" class="d-mask"/>
  <text x="180" y="589" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-link">GET …/PROGRESS</text>
  <rect x="312" y="612" width="112" height="12" rx="0" class="d-mask"/>
  <text x="368" y="621" font-size="9" letter-spacing="0.06em" text-anchor="middle" class="d-mono d-soft">READ CRAWL_COUNTS</text>

  <!-- Actors -->
  <rect x="16" y="24" width="144" height="48" rx="0" class="d-ext"/>
  <text x="88" y="45" font-size="13" text-anchor="middle" class="d-name d-ink">Dashboard</text>
  <text x="88" y="61" font-size="10" text-anchor="middle" class="d-mono d-muted">operator's browser</text>

  <rect x="200" y="24" width="144" height="48" rx="0" class="d-node"/>
  <text x="272" y="45" font-size="13" text-anchor="middle" class="d-name d-ink">API routes</text>
  <text x="272" y="61" font-size="10" text-anchor="middle" class="d-mono d-muted">apps/web/app/api</text>

  <rect x="392" y="24" width="144" height="48" rx="0" class="d-store"/>
  <text x="464" y="45" font-size="13" text-anchor="middle" class="d-name d-ink">D1</text>
  <text x="464" y="61" font-size="10" text-anchor="middle" class="d-mono d-muted">pages, crawl_counts</text>

  <rect x="592" y="24" width="144" height="48" rx="0" class="d-node"/>
  <text x="664" y="45" font-size="13" text-anchor="middle" class="d-name d-ink">site-analysis</text>
  <text x="664" y="61" font-size="10" text-anchor="middle" class="d-mono d-muted">Workflow</text>

  <rect x="792" y="24" width="144" height="48" rx="0" class="d-ext"/>
  <text x="864" y="45" font-size="13" text-anchor="middle" class="d-name d-ink">Outside</text>
  <text x="864" y="61" font-size="10" text-anchor="middle" class="d-mono d-muted">sites, Google, GitHub</text>

  <!-- Legend -->
  <line x1="24" y1="680" x2="936" y2="680" class="d-zone"/>
  <text x="24" y="703" font-size="9" letter-spacing="0.14em" class="d-mono d-soft">LEGEND</text>
  <rect x="96" y="694" width="16" height="10" rx="0" class="d-arrow-accent"/>
  <text x="120" y="703" font-size="9" class="d-mono d-muted">crawl loop</text>
  <rect x="210" y="692" width="8" height="14" rx="0" class="d-store"/>
  <text x="226" y="703" font-size="9" class="d-mono d-muted">Workflow running</text>
  <line x1="352" y1="699" x2="380" y2="699" class="d-arrow" marker-end="url(#dg-analysis-flow-arrow)"/>
  <text x="388" y="703" font-size="9" class="d-mono d-muted">binding / step call</text>
  <line x1="528" y1="699" x2="556" y2="699" class="d-arrow-link" marker-end="url(#dg-analysis-flow-arrow-link)"/>
  <text x="564" y="703" font-size="9" class="d-mono d-muted">HTTP</text>
  <line x1="616" y1="699" x2="644" y2="699" class="d-arrow-accent" marker-end="url(#dg-analysis-flow-arrow-accent)"/>
  <text x="652" y="703" font-size="9" class="d-mono d-muted">crawl fetch (6 at a time)</text>
</svg>
